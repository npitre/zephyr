# ExecuTorch + Ethos-U NPU inference sample
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXECUTORCH=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Disable full portable ops — selective build pulls in only what the model needs
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n

# Allocator pool sizes (bytes) — scale with model complexity
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=2097152
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=65536
