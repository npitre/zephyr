# ExecuTorch + Ethos-U NPU sample
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXECUTORCH=y
CONFIG_ETHOS_U=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# Disable full portable ops for now — selective ops will be used
# when an actual model is added (Commit 2).
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=n
