# ExecuTorch + Ethos-U NPU inference sample
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXECUTORCH=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Enable all portable ops — the runtime needs quantize/dequantize ops for
# input/output tensor processing even in fully-delegated models.
CONFIG_EXECUTORCH_BUILD_PORTABLE_OPS=y

# Allocator pool sizes (bytes) — scale with model complexity
CONFIG_EXECUTORCH_METHOD_ALLOCATOR_POOL_SIZE=2097152
CONFIG_EXECUTORCH_TEMP_ALLOCATOR_POOL_SIZE=65536
